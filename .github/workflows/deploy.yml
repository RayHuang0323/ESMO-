name: Deploy Vite site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── 需不需要部署（Release Engineering S1，2026-11-26；本機驗證，尚無真實 CI 證據）──────────
  #  只有「自最後一次『成功』部署以來全部是不進 bundle 的文件」才跳過；任何不確定都部署。
  #  不用 paths-ignore：它看不到上一次部署失敗（產品版本會因後續的文件 push 而永遠不上線），
  #  也會把 public/**/*.md、被 ?raw 匯入的 .md 誤當文件。規則與測試：tools/ci/deploy_decision.mjs、
  #  tools/check_ci_deploy_decision.mjs。workflow_dispatch（手動部署）一律部署。
  decide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      expect_identical_bundle: ${{ steps.decide.outputs.expect_identical_bundle }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decide
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        #  判斷腳本出錯也只會輸出 deploy=true；這一步本身失敗時下面的 build 用 != 'false' 判斷，照樣部署。
        run: node tools/ci/deploy_decision.mjs --repo . --head "${{ github.sha }}" --event "${{ github.event_name }}" --last-deployed-from-api --github-output "$GITHUB_OUTPUT"

  build:
    needs: decide
    #  只有明確判定 deploy=false 才跳過；decide 失敗、取消或沒有輸出都照常 build＋部署
    if: ${{ !cancelled() && needs.decide.outputs.deploy != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      #  2026-11-26：npm install → npm ci。npm ci 嚴格照 package-lock.json 安裝、不改 lockfile；
      #  本機實測 npm ci 裝出的整棵樹與現有環境相同（202 條目、0 不符），build 出的 581 檔與正式站逐位元相同。
      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Verify installed tree matches lockfile
        run: node tools/ci/check_installed_tree.mjs

      # ── Supabase 連線設定（Backend B1D.2）────────────────────────────────
      #  兩個變數放在 repo 的 **Variables**（不是 Secrets）。理由：
      #  `VITE_*` 一定會被打包進**公開的** JavaScript，放 Secrets 只會給人
      #  「它被保護著」的錯覺。anon key 本來就是設計成公開的，資料保護
      #  完全來自 RLS（supabase/migrations/）。
      #
      #  ⚠ **沒有設定這兩個變數時，這裡會是空字串，而那是完全正常的狀態**：
      #    build 照樣成功，線上就是「未開放雲端存檔」，存檔全部走
      #    LocalSaveProvider。正式站目前就是這樣。
      - name: Check Supabase env
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        #  ⚠ 這一步會在**貼錯 service-role key** 或**只設一半**時讓部署失敗。
        #    寧可部署失敗，也不要把一把繞過 RLS 的金鑰永久 build 進公開 bundle。
        run: node tools/check_supabase_env.mjs

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          #  ⚠ 正式站的 OAuth 導回位址。留空時程式會用「目前的網址」，
          #    對 GitHub Pages 來說那已經是對的，所以不設也能運作。
          VITE_SUPABASE_REDIRECT_URL: ${{ vars.VITE_SUPABASE_REDIRECT_URL }}
          #  ⚠ 匿名登入**刻意不在正式站開**：訪客帳號換裝置就找不回來，
          #    讓玩家在正式站用它建立整個生涯，是我們在幫他製造損失。
          #    （所以這裡不傳 VITE_SUPABASE_ALLOW_ANONYMOUS。）
        run: npm run build

      #  印出整個 dist 的內容雜湊：部署後可與正式站逐檔比對（本機以 VITE_SUPABASE_* 空字串 build 可重現）
      - name: Print dist hash
        run: node --input-type=module -e "import { hashDir } from './tools/lib/releaseGate.mjs'; console.log('DIST_HASH', JSON.stringify(hashDir('dist')))"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      #  部署「之前」逐檔比對 dist 與目前正式站（S1.1，TD-65；本機實測 581/581 相同）。
      #  只有 decide 判定「push、而且自最後成功部署以來沒有任何產品／建置輸入或 .github 變更」時才要求必須相同：
      #  那時 bundle 不同＝意外（例如依賴或 Node 行為改變），在這裡失敗、不部署。其他情況只回報、不擋。
      - name: Compare dist with production (before deploy)
        env:
          EXPECT_IDENTICAL: ${{ github.event_name == 'push' && needs.decide.outputs.expect_identical_bundle == 'true' }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node tools/ci/compare_dist_with_site.mjs --dist dist --site "$SITE_URL/" --expect-identical "$EXPECT_IDENTICAL"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    #  不能用預設的 success()：它會連帶看 decide 的結果；decide 失敗時 build 照跑、deploy 卻被跳過（2026-11-26 審查修正）
    if: ${{ !cancelled() && needs.build.result == 'success' }}

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4